name: Read-only MCP gateway checks
on:
  push:
    branches: ['feat/read-only-mcp-gateway']
  pull_request:
    paths:
      - 'mcp-gateway/**'
      - '.github/workflows/mcp-gateway.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
