name: Shopify app scaffold validation
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SHOPIFY_API_KEY: test-client-id
      SHOPIFY_API_SECRET: test-secret-not-for-production
      SHOPIFY_APP_URL: https://example.invalid
      SCOPES: read_products
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Scanner tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Apply development database migrations
        run: npm run setup
      - name: Verify session persistence in test database
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          import assert from 'node:assert/strict';
          const db = new PrismaClient();
          const id = 'ci-session-persistence-test';
          try {
            await db.session.create({data:{id,shop:'test-shop.myshopify.com',state:'ci',isOnline:false,accessToken:'ci-only-not-real'}});
            const session = await db.session.findUnique({where:{id}});
            assert.equal(session?.shop,'test-shop.myshopify.com');
            await db.session.delete({where:{id}});
            console.log('Session write/read/delete passed');
          } finally { await db.$disconnect(); }
          NODE
      - name: Smoke-test production HTTP server without merchant access
        run: |
          NODE_ENV=production PORT=3000 npm run start > /tmp/visibility-doctor-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl -s --max-time 2 -o /tmp/visibility-doctor-response -w '%{http_code}' http://127.0.0.1:3000/auth/login > /tmp/visibility-doctor-code; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo 'HTTP server did not start'; tail -80 /tmp/visibility-doctor-server.log; exit 1
          fi
          code=$(cat /tmp/visibility-doctor-code)
          echo "Login HTTP status: $code"
          if [ "$code" != "200" ]; then
            tail -80 /tmp/visibility-doctor-server.log
            exit 1
          fi
          grep -q 'Shop domain' /tmp/visibility-doctor-response
          echo 'Production login route returned the shop-domain form'
